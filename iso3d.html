<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0a18">
<title>ODYSSEIA · 3D 시험 — 한라의 정상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{ --gold:#c9a86a; --gold2:#f2d48a; --serif:'Gowun Batang',serif; --sans:'Noto Sans KR',system-ui,sans-serif; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; background:#07060f; overscroll-behavior:none; }
body{ font-family:var(--sans); color:#fff; overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
#app{ position:fixed; inset:0; }
canvas#gl{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.pill{ height:30px; padding:0 14px; display:flex; align-items:center; gap:7px; border-radius:15px 6px 6px 15px; border:1px solid rgba(201,168,106,.75);
  background:linear-gradient(180deg,rgba(38,42,60,.92),rgba(22,24,38,.92)); font-size:12px; font-weight:700; color:#f0e6cf; box-shadow:0 2px 8px rgba(0,0,0,.4); }
#topL{ position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); left:calc(12px + env(safe-area-inset-left,0px)); display:flex; gap:8px; z-index:5; align-items:center; }
#back{ width:40px; height:40px; border-radius:50%; border:1px solid rgba(201,168,106,.7); background:linear-gradient(180deg,rgba(46,50,72,.9),rgba(24,26,40,.9)); color:#f0e6cf; font-size:16px; }
#unit{ position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); right:calc(12px + env(safe-area-inset-right,0px)); z-index:5; display:flex; align-items:center; gap:10px;
  padding:7px 14px 7px 7px; border-radius:6px; border:1px solid rgba(201,168,106,.7); background:linear-gradient(180deg,rgba(34,38,56,.9),rgba(20,22,34,.9)); }
#unit .face{ width:38px; height:38px; border-radius:4px; overflow:hidden; border:1px solid rgba(201,168,106,.6); background:#2a3044; }
#unit b{ display:block; font-size:12px; color:#f6efdc; }
.gb{ position:relative; width:120px; height:9px; border-radius:3px; background:#0a0818; box-shadow:0 0 0 1px rgba(201,168,106,.5); overflow:hidden; margin-top:3px; }
.gb i{ display:block; height:100%; width:100%; background:linear-gradient(180deg,#b6f0a0,#4fbf6a); }
#bossBar{ position:absolute; left:50%; top:calc(14px + env(safe-area-inset-top,0px)); transform:translateX(-50%); width:min(440px,54vw); z-index:5; text-align:center; opacity:0; transition:opacity .5s; }
#bossBar.on{ opacity:1; }
#bossName{ font-family:var(--serif); font-size:13px; letter-spacing:2px; color:#f4e6ff; text-shadow:0 1px 4px #000; margin-bottom:3px; }
#bossBar .bar{ height:10px; border-radius:3px; background:#140f22; border:1px solid #c9a86a; overflow:hidden; }
#bossFill{ height:100%; width:100%; background:linear-gradient(180deg,#d8b8ff,#8a5ae0 60%,#5a2ab0); transition:width .2s; }
#hint{ position:absolute; left:50%; top:28%; transform:translateX(-50%); z-index:5; padding:8px 18px; border-radius:6px; font-size:13px; text-align:center; max-width:80vw;
  background:rgba(16,14,30,.72); border:1px solid rgba(201,168,106,.5); opacity:0; transition:opacity .4s; pointer-events:none; }
#hint.on{ opacity:1; }
#nums{ position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
.num{ position:absolute; font-weight:900; font-size:26px; color:#ffb347; text-shadow:0 2px 0 #3a1a0a,0 0 12px rgba(255,170,60,.7); animation:numUp .9s ease-out forwards; }
.num.crit{ font-size:34px; color:#ff6f9f; text-shadow:0 2px 0 #4a0a22,0 0 14px rgba(255,110,160,.8); }
.num.me{ color:#c9b6ff; }
@keyframes numUp{ from{ transform:translate(-50%,0) scale(.6); opacity:0; } 25%{ transform:translate(-50%,-16px) scale(1.15); opacity:1; } to{ transform:translate(-50%,-54px) scale(1); opacity:0; } }
#joy{ position:absolute; left:calc(22px + env(safe-area-inset-left,0px)); bottom:calc(22px + env(safe-area-inset-bottom,0px)); width:124px; height:124px; border-radius:50%;
  background:radial-gradient(circle,rgba(28,30,48,.5),rgba(12,12,24,.35)); border:1px solid rgba(201,168,106,.35); z-index:6; touch-action:none; }
#knob{ position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#f0f2ff,#8e93b8); box-shadow:0 3px 10px rgba(0,0,0,.5); }
#btns{ position:absolute; right:calc(20px + env(safe-area-inset-right,0px)); bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:6; display:flex; align-items:flex-end; gap:12px; }
.ctl{ border-radius:50%; border:1px solid rgba(201,168,106,.8); color:#fff6e2; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:12px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35), 0 5px 14px rgba(0,0,0,.45); }
#bAtk{ width:86px; height:86px; font-size:13px; background:radial-gradient(circle at 40% 32%,#e07a6a,#8a2a32); }
#bDash{ width:62px; height:62px; margin-bottom:12px; background:radial-gradient(circle at 40% 32%,#6a8ad8,#2a3a78); }
#card{ position:absolute; inset:0; z-index:9; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  background:radial-gradient(ellipse at center,rgba(18,16,34,.92),rgba(6,6,14,.97)); padding:20px; }
#card small{ font-size:11px; letter-spacing:4px; color:var(--gold2); }
#card h1{ font-family:var(--serif); font-size:clamp(24px,6vw,38px); margin:6px 0 2px; }
#card p{ font-size:13px; color:#cfd2e0; line-height:1.9; margin:10px 0 18px; }
#card button{ padding:11px 30px; border-radius:6px; border:1px solid #7a5418; cursor:pointer; font-family:var(--sans); font-weight:700; font-size:14px;
  background:linear-gradient(180deg,#fff0c2,#f2c66d 45%,#c9913a); color:#2a2010; margin-top:6px; }
#card .sub{ background:transparent; color:#e8cf96; border-color:rgba(201,168,106,.5); }
#fade{ position:absolute; inset:0; z-index:8; background:#07060f; opacity:0; pointer-events:none; transition:opacity .6s; }
@media (orientation:portrait){ #bossBar{ width:82vw; top:calc(58px + env(safe-area-inset-top,0px)); } }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="topL"><button id="back" class="pill" style="border-radius:50%; justify-content:center; padding:0">←</button><div class="pill">한라의 정상 · 3D 시험</div></div>
  <div id="unit"><div class="face"><canvas id="uFace" width="38" height="38"></canvas></div><div><b>전시현</b><div class="gb"><i id="uHp"></i></div></div></div>
  <div id="bossBar"><div id="bossName">외눈의 거인 폴리페모스</div><div class="bar"><div id="bossFill"></div></div></div>
  <div id="hint"></div>
  <div id="nums"></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="btns"><button id="bDash" class="ctl">회피</button><button id="bAtk" class="ctl">공격</button></div>
  <div id="card">
    <small>3D PROTOTYPE</small>
    <h1 id="cTitle">한라의 정상</h1>
    <p id="cText">구름바다 위에 떠 있는 분화구.<br>외눈의 거인과의 싸움을 3D로 옮긴 시험판이에요.<br><br>조이스틱으로 움직이고, 공격 버튼을 누르고 있으면 화살이 나가요.<br>바닥에 붉은 범위가 뜨면 피하세요. 회피 버튼으로 구를 수 있어요.</p>
    <button id="cGo">시작</button>
    <button id="cBack" class="sub">2D 버전으로</button>
  </div>
  <div id="fade"></div>
</div>
<script src="js/story.js"></script>
<script src="js/avatar.js"></script>
<script src="js/ch2.js"></script>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
<script type="module" src="js/iso3d.js"></script>
</body>
</html>
