<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1726">
<title>ODYSSEIA · 이타카 — 오디세우스의 섬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{ --gold:#c9a86a; --gold2:#f2d48a; --wood:#4a3524; --wood2:#2e2117; --serif:'Gowun Batang',serif; --sans:'Noto Sans KR',system-ui,sans-serif; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; background:#15131f; overscroll-behavior:none; }
body{ font-family:var(--sans); color:#f2e6c8; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
#app{ position:fixed; inset:0; }
canvas#gl{ position:absolute; inset:0; display:block; image-rendering:pixelated; }

/* 거상식 나무·금속 창틀 */
.panel{ position:relative; background:linear-gradient(180deg,#5a4028,#3a2817 60%,#2a1d11);
  border:2px solid #1d1309; border-radius:5px;
  box-shadow:inset 0 0 0 1px rgba(214,176,112,.55), inset 0 8px 14px rgba(255,220,160,.10), 0 6px 18px rgba(0,0,0,.55); }
.panel::before{ content:''; position:absolute; inset:3px; border:1px solid rgba(214,176,112,.35); border-radius:3px; pointer-events:none; }

#topL{ position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); left:calc(12px + env(safe-area-inset-left,0px)); z-index:5; display:flex; gap:8px; align-items:center; }
.tag{ padding:7px 14px; font-size:12px; font-weight:700; letter-spacing:1px; }
#back{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; }

#party{ position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); right:calc(12px + env(safe-area-inset-right,0px)); z-index:5; display:flex; flex-direction:column; gap:6px; }
.card{ display:flex; align-items:center; gap:9px; padding:6px 12px 6px 6px; min-width:168px; }
.card .ava{ width:34px; height:34px; border-radius:3px; background:#1a1526; border:1px solid rgba(214,176,112,.5); overflow:hidden; }
.card b{ display:block; font-size:12px; color:#f6ecd4; }
.bar{ position:relative; width:104px; height:8px; margin-top:3px; border-radius:2px; background:#160f08; box-shadow:inset 0 0 0 1px rgba(214,176,112,.45); overflow:hidden; }
.bar i{ display:block; height:100%; background:linear-gradient(180deg,#b6f0a0,#4fbf6a); }

#btns{ position:absolute; right:calc(18px + env(safe-area-inset-right,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:6; display:flex; gap:12px; align-items:flex-end; }
.ctl{ width:76px; height:76px; border-radius:50%; border:2px solid #1d1309; cursor:pointer;
  background:radial-gradient(circle at 38% 30%,#d8a05a,#8a5420 60%,#5a3412);
  box-shadow:inset 0 2px 0 rgba(255,225,170,.45), 0 6px 16px rgba(0,0,0,.5);
  color:#2a1a08; font-weight:900; font-size:14px; font-family:var(--sans); }
.ctl.small{ width:58px; height:58px; font-size:12px; background:radial-gradient(circle at 38% 30%,#9ab4d8,#3e5a8a 60%,#28385a); color:#eaf2ff; }

#hint{ position:absolute; left:50%; bottom:calc(26px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:5;
  padding:9px 18px; font-size:12px; letter-spacing:.5px; opacity:.95; }
#loading{ position:absolute; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
  background:radial-gradient(ellipse at center,rgba(26,22,38,.96),rgba(10,8,16,.99)); font-family:var(--serif); font-size:16px; letter-spacing:3px; }
#loading small{ font-family:var(--sans); font-size:11px; letter-spacing:1px; color:#9a8f7a; }
@media (orientation:portrait){ .card{ min-width:150px; } .bar{ width:88px; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <div id="topL">
    <div class="panel" id="back" onclick="location.href='index.html'">←</div>
    <div class="panel tag">이타카 · 오디세우스의 섬</div>
  </div>

  <div id="party">
    <div class="panel card"><div class="ava"></div><div><b>전시현</b><div class="bar"><i style="width:100%"></i></div></div></div>
    <div class="panel card"><div class="ava"></div><div><b>세은</b><div class="bar"><i style="width:100%"></i></div></div></div>
    <div class="panel card"><div class="ava"></div><div><b>이안</b><div class="bar"><i style="width:100%"></i></div></div></div>
  </div>

  <div id="btns">
    <button class="ctl small" id="bTalk">대화</button>
    <button class="ctl" id="bAtk">공격</button>
  </div>

  <div class="panel tag" id="hint">바닥을 누르면 그곳으로 걸어가요 · 가족이 줄지어 따라와요</div>

  <div id="loading">이타카로 가는 길<small>섬을 불러오는 중…</small></div>
</div>
<script src="js/gosang.js"></script>
</body>
</html>
