<style>
:root{
  --gold:#f2c66d; --gold2:#d9a441; --ink:#120d26; --lav:#cbb8e8; --cream:#fff8e8;
  --serif:'Gowun Batang', 'Noto Serif KR', 'Nanum Myeongjo', serif;
  --sans:'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; background:var(--ink); overscroll-behavior:none;}
body{ font-family:var(--sans); color:#fff; overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none; overscroll-behavior:none; }
button{ font-family:inherit; cursor:pointer; touch-action:manipulation; }
.hidden{display:none !important;}

.screen{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; overflow:hidden; }
.screen.active{ display:flex; }
.pill{ background:rgba(0,0,0,.45); color:#fff; border:1px solid rgba(255,255,255,.18); padding:7px 13px; border-radius:999px; font-size:12px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.btn{ background:linear-gradient(120deg,var(--gold),var(--gold2)); color:#3a2a10; border:none; padding:14px 34px; border-radius:999px; font-size:15px; font-weight:700; box-shadow:0 8px 24px rgba(217,164,65,.4); transition:transform .15s, opacity .3s; }
.btn:active{ transform:scale(.95); }
.btn:disabled{ opacity:.55; box-shadow:none; }

/* ===== 타이틀 ===== */
#screen-title{ justify-content:center; background:radial-gradient(circle at 50% 38%, #3a2a66 0%, #1a1236 55%, #0a0818 100%); }
.star{position:absolute; background:#fff; border-radius:50%; opacity:.6; animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }
.title-inner{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; text-align:center; padding:20px; }
.logo{ font-size:11px; letter-spacing:5px; color:var(--gold2); font-weight:700; }
.hero-orb{ width:clamp(96px, 26vh, 180px); aspect-ratio:1; border-radius:50%; overflow:hidden; margin:clamp(10px,3vh,22px) 0; border:2px solid rgba(242,198,109,.8);
  box-shadow:0 0 0 6px rgba(242,198,109,.12), 0 0 50px rgba(242,198,109,.45); animation:orbFloat 5s ease-in-out infinite; }
.hero-orb img{ width:100%; height:100%; object-fit:cover; display:block; }
@keyframes orbFloat{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
.title-main{ font-family:var(--serif); font-size:clamp(24px, 6.5vw, 38px); color:var(--gold); font-weight:700; letter-spacing:2px; text-shadow:0 0 24px rgba(242,198,109,.5); }
.title-sub2{ font-family:var(--serif); font-size:15px; color:var(--lav); margin-top:6px; letter-spacing:3px; }
.sub{ font-family:var(--serif); color:#b8a8d0; margin-top:clamp(8px,2.4vh,18px); font-size:14px; }
.dday{ margin:6px 0 clamp(12px,3vh,24px); font-size:13px; color:var(--gold); letter-spacing:2px; font-weight:700; }
.loadbar{ width:160px; height:3px; background:rgba(255,255,255,.12); border-radius:3px; margin-top:14px; overflow:hidden; transition:opacity .4s; }
.loadbar i{ display:block; height:100%; width:0; background:var(--gold); transition:width .2s; }

/* ===== 월드맵 ===== */
#screen-map{ background:radial-gradient(ellipse at 50% 0%, #6a5a9a 0%, #3a2a5a 45%, #1c1433 100%); padding:calc(10px + var(--sat)) calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal)); }
.map-header{ width:100%; max-width:820px; display:flex; align-items:center; justify-content:space-between; gap:10px; z-index:5; }
.map-header .center{ text-align:center; }
.map-title{ font-family:var(--serif); font-size:22px; color:var(--cream); font-weight:700; margin-top:2px; }
.map-progress{ font-size:12px; color:var(--gold); min-width:64px; text-align:right; }
#worldMapArea{ position:relative; width:100%; max-width:820px; flex:1; margin-top:8px; }
.cloud{position:absolute; font-size:24px; opacity:.35; animation:drift 34s linear infinite; pointer-events:none;}
@keyframes drift{ from{transform:translateX(-60px);} to{transform:translateX(110vw);} }
.mapSvg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
.mapSvg path{stroke:var(--gold); stroke-width:2.5; fill:none; stroke-dasharray:7 7; opacity:.6; animation:dash 2s linear infinite; vector-effect:non-scaling-stroke;}
@keyframes dash{ to{ stroke-dashoffset:-28; } }
.node{ position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; z-index:6; background:none; border:none; color:inherit; }
.node-circle{ position:relative; width:clamp(52px,9vh,68px); aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:clamp(22px,4vh,30px);
  background:radial-gradient(circle,#fff9e8,var(--gold)); border:3px solid #fff8e0; box-shadow:0 0 22px rgba(242,198,109,.6); animation:nodePulse 2.4s ease-in-out infinite; }
@keyframes nodePulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.07);} }
.node.soon .node-circle{ background:#5a5468; filter:grayscale(.6); opacity:.55; animation:none; box-shadow:none; }
.node.cleared .node-circle{ animation:none; box-shadow:0 0 14px rgba(127,209,185,.6); border-color:#bff0e0; }
.node .badge{ position:absolute; right:-4px; top:-4px; width:22px; height:22px; border-radius:50%; background:#7fd1b9; color:#12302a; font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }
.node-label{ margin-top:6px; font-size:11px; font-weight:700; background:rgba(20,10,35,.75); padding:4px 9px; border-radius:999px; color:var(--gold); white-space:nowrap; }
.node-sub{ font-size:10px; color:#d8cdef; margin-top:3px; white-space:nowrap; text-shadow:0 1px 3px #000; }

/* ===== 게임 화면 (메이플식 레이아웃) ===== */
#screen-game{ background:#07060f; padding-top:var(--sat); }
#stageWrap{ position:relative; flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:none; }
#ambient{ position:absolute; inset:-40px; background-size:cover; background-position:center; filter:blur(26px) brightness(.4) saturate(1.2); }
#stage{ position:relative; overflow:hidden; border-radius:4px; box-shadow:0 10px 40px rgba(0,0,0,.6); }
#parallaxBg{ position:absolute; inset:0; overflow:hidden; background:#2a2340; }
#parallaxImg{ position:absolute; top:0; left:0; max-width:none; transition:opacity .35s; will-change:transform; }
canvas#game{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#screenFlash{ position:absolute; inset:0; background:#fff8e0; opacity:0; pointer-events:none; z-index:8; }
#screenFlash.flashPulse{ animation:flashPulseAnim .45s ease; }
@keyframes flashPulseAnim{ 0%{opacity:.5;} 100%{opacity:0;} }
.shakeFx{ animation:shakeAnim .3s ease; }
@keyframes shakeAnim{ 10%{transform:translate(-5px,3px);} 30%{transform:translate(5px,-3px);} 50%{transform:translate(-4px,2px);} 70%{transform:translate(4px,-2px);} 100%{transform:translate(0,0);} }
#fade{ position:absolute; inset:0; background:#05040c; opacity:0; pointer-events:none; transition:opacity .26s; z-index:9; }
#fade.on{ opacity:1; }

/* 미니맵 */
#minimap{ position:absolute; top:6px; left:6px; z-index:6; background:rgba(12,10,30,.74); border:1px solid rgba(242,198,109,.6); border-radius:6px; overflow:hidden; pointer-events:none; }
#mmTitle{ font-size:10.5px; font-weight:700; color:#ffe9b0; padding:3px 8px; background:linear-gradient(180deg,rgba(242,198,109,.24),rgba(242,198,109,.08)); border-bottom:1px solid rgba(242,198,109,.35); white-space:nowrap; max-width:190px; overflow:hidden; text-overflow:ellipsis; }
#miniCanvas{ display:block; }

#mapBanner{ position:absolute; top:24%; left:50%; transform:translate(-50%,6px); font-family:var(--serif); font-weight:700; font-size:clamp(17px,4.2vh,24px); color:var(--cream); letter-spacing:2px;
  text-shadow:0 2px 12px rgba(0,0,0,.85), 0 0 22px rgba(242,198,109,.55); opacity:0; transition:opacity .5s, transform .5s; pointer-events:none; white-space:nowrap; z-index:7; }
#mapBanner::before, #mapBanner::after{ content:'✦'; color:var(--gold); font-size:.6em; margin:0 .6em; vertical-align:middle; }
#mapBanner.show{ opacity:1; transform:translate(-50%,0); }
#floatMsg{ position:absolute; left:50%; top:30%; transform:translateX(-50%); max-width:86%; width:max-content; background:rgba(255,255,255,.95); color:#6a4f96; padding:9px 16px; border-radius:14px; font-family:var(--serif); font-size:13.5px; line-height:1.6; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,.3); opacity:0; transition:opacity .35s, transform .35s; pointer-events:none; z-index:7; }
#floatMsg.show{ opacity:1; transform:translateX(-50%) translateY(4px); }

#topBtns{ position:absolute; top:6px; right:calc(8px + var(--sar)); display:flex; gap:6px; z-index:20; }

/* 퀘스트 알림 */
#questHelper{ position:absolute; top:46px; right:calc(8px + var(--sar)); width:178px; z-index:15; background:rgba(12,10,30,.66); border:1px solid rgba(242,198,109,.4); border-radius:8px; padding:6px 9px 7px; font-size:11px; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
.qh-title{ color:#ffe9b0; font-weight:700; margin-bottom:3px; cursor:pointer; display:flex; justify-content:space-between; gap:6px; }
.qh-title span{ color:#9a90c4; transition:transform .2s; }
.qh-item{ color:#ece6ff; line-height:1.6; }
.qh-item.done{ color:#7fd1b9; }
.qh-item.lock{ color:#8e86b4; }
.qh-more{ color:#a79dd0; font-size:10px; margin-top:3px; }
#questHelper.collapsed .qh-item, #questHelper.collapsed .qh-more{ display:none; }
#questHelper.collapsed .qh-title span{ transform:rotate(-90deg); }

/* 시스템 메시지 */
#chatLog{ position:absolute; left:10px; top:96px; max-width:min(46%,340px); z-index:13; font-size:11px; pointer-events:none; display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
.cl{ background:rgba(8,6,20,.6); padding:2px 8px; border-radius:4px; color:#fff; transition:opacity 1.2s; line-height:1.5; }
.cl.exp{ color:#ffe27a; } .cl.item{ color:#9ff0c6; } .cl.quest{ color:#d9c8ff; } .cl.lv{ color:#ffb3d6; font-weight:700; } .cl.sys{ color:#dfe6ff; }
.cl.old{ opacity:0; }

/* 조작: 조이스틱 + 버튼 */
#controls{ position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; align-items:flex-end; padding:0 calc(14px + var(--sar)) 10px calc(14px + var(--sal)); pointer-events:none; z-index:14; }
#controls > *{ pointer-events:auto; }
#joy{ position:relative; width:116px; height:116px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.05) 40%, rgba(255,255,255,.14)); border:2px solid rgba(255,255,255,.32); touch-action:none; }
#joy::before{ content:'▲\A◀     ▶\A▼'; white-space:pre; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; font-size:10px; line-height:2.9; color:rgba(255,255,255,.35); pointer-events:none; }
#joyKnob{ position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fffbe8, #e6c170); border:2px solid #fff; box-shadow:0 4px 12px rgba(0,0,0,.45); pointer-events:none; }
#joyKnob.back{ transition:transform .12s ease-out; }
.actBtns{ display:flex; align-items:flex-end; gap:10px; }
.ab-col{ display:flex; flex-direction:column; align-items:center; gap:8px; }
.ctl{ width:62px; height:62px; border-radius:50%; border:2px solid rgba(255,255,255,.6); background:rgba(20,16,44,.45); color:#fff; font-size:21px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); touch-action:none; }
.ctl small{ font-size:10.5px; font-weight:700; margin-top:3px; }
.ctl.pressed{ transform:scale(.9); filter:brightness(1.25); }
#btnAct{ background:radial-gradient(circle,#b9e8ff,#4f9ad8); border-color:#fff; }
#btnAct.idle{ background:rgba(20,16,44,.45); border-color:rgba(255,255,255,.35); opacity:.6; }
#btnAct.ready{ background:radial-gradient(circle,#fff3b0,#e0a93a); color:#3a2a10; animation:actionPulse 1.1s ease-in-out infinite; }
#btnJump{ width:80px; height:80px; background:radial-gradient(circle,#ffe27a,#e0a93a); color:#3a2a10; border-color:#fff; box-shadow:0 6px 18px rgba(0,0,0,.4); }
#screen-game:not(.combat) #btnAtk, #screen-game:not(.combat) #btnSkill{ display:none; }
#screen-game.combat #btnJump{ width:66px; height:66px; }
#btnAtk{ width:80px; height:80px; background:radial-gradient(circle,#ffd0e0,#e0507e); color:#fff; border-color:#fff; box-shadow:0 6px 18px rgba(0,0,0,.4); font-size:26px; }
#btnSkill{ position:relative; overflow:hidden; background:radial-gradient(circle,#efe4ff,#8a6fd0); color:#fff; border-color:#fff; }
#btnSkill .cd{ position:absolute; inset:0; border-radius:50%; background:conic-gradient(rgba(10,8,24,.72) calc(var(--cd,0) * 360deg), transparent 0); pointer-events:none; }
#btnAtk.locked, #btnSkill.locked{ filter:grayscale(.85); opacity:.5; }
@keyframes actionPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
@media (hover:hover) and (pointer:fine){
  #controls{ display:none !important; }
}

/* 상태바 + 경험치 */
#statusBar{ flex-shrink:0; width:100%; display:flex; align-items:center; gap:8px; padding:5px calc(8px + var(--sar)) 5px calc(8px + var(--sal)); background:linear-gradient(180deg,#261d4c,#15102e); border-top:1px solid rgba(242,198,109,.6); z-index:20; }
.sb-lv{ display:flex; align-items:baseline; gap:2px; background:#0c0a1e; border:1px solid rgba(242,198,109,.7); border-radius:5px; padding:2px 8px; color:var(--gold); flex-shrink:0; }
.sb-lv small{ font-size:10px; font-weight:700; }
.sb-lv b{ font-size:17px; font-weight:900; font-variant-numeric:tabular-nums; }
.sb-lv.flash{ animation:lvFlash 1.2s ease; }
@keyframes lvFlash{ 0%,60%{ box-shadow:0 0 0 3px rgba(255,226,122,.8), 0 0 18px rgba(255,226,122,.9); } 100%{ box-shadow:none; } }
.sb-name{ display:flex; flex-direction:column; line-height:1.15; flex-shrink:0; }
.sb-name b{ font-size:12.5px; color:#fff; }
.sb-name small{ font-size:9.5px; color:#b9aee0; }
.sb-gauges{ flex:1; display:flex; gap:10px; min-width:0; }
.gauge{ flex:1; display:flex; align-items:center; gap:5px; min-width:0; }
.gl{ font-size:10px; font-weight:700; flex-shrink:0; }
.gauge.hp .gl{ color:#ffb3cf; } .gauge.mp .gl{ color:#9fd4ff; }
.gb{ position:relative; flex:1; height:15px; min-width:36px; background:#0c0a1e; border:1px solid rgba(255,255,255,.28); border-radius:3px; overflow:hidden; }
.gb i{ position:absolute; left:0; top:0; bottom:0; width:0; transition:width .45s; }
.hp .gb i{ background:linear-gradient(180deg,#ffa9c8,#e0507e); }
.mp .gb i{ background:linear-gradient(180deg,#a8e0ff,#3f8fd8); }
.gb.low{ animation:lowHp 1s ease-in-out infinite; }
@keyframes lowHp{ 0%,100%{ box-shadow:none; } 50%{ box-shadow:0 0 0 2px rgba(255,90,126,.8); } }
.gb em{ position:absolute; inset:0; font-style:normal; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; color:#fff; text-shadow:0 1px 2px #000; font-variant-numeric:tabular-nums; }
.sb-menu{ display:flex; gap:4px; flex-shrink:0; }
.sb-menu button{ width:42px; height:36px; border-radius:6px; background:rgba(255,255,255,.07); border:1px solid rgba(242,198,109,.4); color:#fff; font-size:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; }
.sb-menu button small{ font-size:8.5px; margin-top:3px; color:#d9cff5; }
.sb-menu button:active{ transform:scale(.94); }
.sb-menu button.flash{ animation:lvFlash 1.2s ease; }
#expBar{ position:relative; flex-shrink:0; width:100%; height:calc(14px + var(--sab)); background:#0c0a1e; border-top:1px solid #000; z-index:20; }
#expBar i{ position:absolute; left:0; top:0; height:14px; width:0; background:linear-gradient(180deg,#fff4b0,#e3b53c); transition:width .6s; }
#expBar span{ position:absolute; left:0; right:0; top:0; height:14px; font-size:9.5px; line-height:14px; text-align:center; font-weight:700; color:#fff; text-shadow:0 1px 2px #000, 0 0 3px #000; font-variant-numeric:tabular-nums; }

/* 가로 폰: 높이가 낮으면 살짝 압축 */
@media (orientation:landscape) and (max-height:430px){
  #statusBar{ padding-top:3px; padding-bottom:3px; }
  .sb-menu button{ height:30px; }
  .sb-menu button small{ display:none; }
  #joy{ width:104px; height:104px; }
  .ctl{ width:54px; height:54px; } #btnJump{ width:68px; height:68px; } #btnAtk{ width:68px; height:68px; }
  #screen-game.combat #btnJump{ width:58px; height:58px; } .ab-col{ gap:6px; }
}

/* 세로 화면 */
#dock{ display:none; }
#screen-game.portrait #stageWrap{ flex:0 0 auto; }
#screen-game.portrait #dock{ display:flex; flex:1 1 auto; min-height:0; width:100%; gap:8px; padding:8px 10px 0; overflow:hidden; }
#screen-game.portrait #questHelper{ position:static; width:auto; flex:1; min-width:0; overflow-y:auto; align-self:flex-start; max-height:100%; }
#screen-game.portrait #chatLog{ position:static; max-width:none; flex:1.15; min-width:0; justify-content:flex-end; overflow:hidden; }
#screen-game.portrait .cl.old{ opacity:.5; }
#screen-game.portrait #controls{ position:static; flex-shrink:0; width:100%; padding:6px calc(22px + var(--sar)) 10px calc(22px + var(--sal)); }
#screen-game.portrait .sb-name small{ display:none; }
#screen-game.portrait #statusBar{ flex-wrap:wrap; row-gap:5px; }
#screen-game.portrait .sb-name{ flex:1; }
#screen-game.portrait .sb-gauges{ order:5; flex-basis:100%; gap:8px; }
#screen-game.portrait .sb-menu button{ width:38px; }

/* ===== 창 (퀘스트 · 가방 · 프로필) ===== */
#win{ position:fixed; inset:0; z-index:150; display:none; align-items:center; justify-content:center; background:rgba(5,4,14,.5); padding:16px; }
.win-panel{ width:100%; max-width:420px; max-height:min(84vh,560px); display:flex; flex-direction:column; background:linear-gradient(180deg,#221a46,#130f2a); border:1px solid rgba(242,198,109,.75); border-radius:10px; box-shadow:0 0 0 3px rgba(18,13,38,.8), 0 20px 50px rgba(0,0,0,.6); overflow:hidden; animation:boxIn .25s ease; }
.win-head{ display:flex; align-items:center; justify-content:space-between; padding:8px 8px 8px 14px; background:linear-gradient(180deg,rgba(242,198,109,.24),rgba(242,198,109,.06)); border-bottom:1px solid rgba(242,198,109,.4); }
.win-head b{ color:#ffe9b0; font-size:14px; }
#winClose{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); border-radius:6px; color:#fff; font-size:13px; width:30px; height:28px; }

  </div>
  <div id="worldMapArea"></div>
</section>

<!-- ================= 게임 화면 ================= -->
<section class="screen" id="screen-game">
  <div id="stageWrap">
    <div id="ambient"></div>
    <div id="stage">
      <div id="parallaxBg"><img id="parallaxImg" alt=""></div>
      <canvas id="game"></canvas>
      <div id="screenFlash"></div>
      <div id="minimap"><div id="mmTitle"></div><canvas id="miniCanvas"></canvas></div>
      <div id="mapBanner"></div>
      <div id="floatMsg"></div>
      <div id="fade"></div>
    </div>
    <div id="topBtns"><button class="pill" id="backToMap">🗺 지도</button><button class="pill" id="muteBtn">🔊</button></div>
    <div id="questHelper"></div>
    <div id="chatLog" aria-live="polite"></div>
    <div id="controls">
      <div id="joy" aria-label="이동 조이스틱"><div id="joyKnob"></div></div>
      <div class="actBtns">
        <div class="ab-col">
          <button class="ctl idle" id="btnAct"><span id="actIcon">💬</span><small id="actLabel">대화</small></button>
          <button class="ctl" id="btnJump"><span>▲</span><small>점프</small></button>
        </div>
        <div class="ab-col">
          <button class="ctl locked" id="btnSkill" aria-label="스킬"><span>✦</span><small id="skillLabel">Lv3</small><i class="cd"></i></button>
          <button class="ctl locked" id="btnAtk" aria-label="공격"><span>🏹</span><small>공격</small></button>
        </div>
      </div>
    </div>
  </div>
  <div id="dock"></div>
  <div id="statusBar">
    <div class="sb-lv"><small>Lv.</small><b id="sbLv">1</b></div>
    <div class="sb-name"><b id="sbName">이안</b><small id="sbTitle"></small></div>
    <div class="sb-gauges">
      <div class="gauge hp"><span class="gl" id="hpLabel">이야기</span><div class="gb"><i id="hpFill"></i><em id="hpText"></em></div></div>
      <div class="gauge mp"><span class="gl" id="mpLabel">조각</span><div class="gb"><i id="mpFill"></i><em id="mpText"></em></div></div>
    </div>
    <div class="sb-menu">
      <button id="mQuest" title="퀘스트 (Q)">📜<small>퀘스트</small></button>
      <button id="mEquip" title="장비 (E)">⚔️<small>장비</small></button>
      <button id="mBag" title="가방 (I)">🎒<small>가방</small></button>
      <button id="mProfile" title="프로필 (P)">👶<small>프로필</small></button>
    </div>
  </div>
  <div id="expBar"><i id="expFill"></i><span id="expText"></span></div>
</section>

<!-- ================= 대화창 ================= -->
<div id="dialogueOverlay">
  <div id="dialogueStage">
    <div id="portraitCard"><img id="portraitImg" alt=""><div id="portraitFallback"></div></div>
    <div id="dialogueBox">
      <div id="speakerName"></div>
      <div id="dialogueText"></div>
      <div id="dlgChoices"></div>
      <div id="dialogueCount"></div>
      <div id="dlgBtns"><button id="dlgStop">대화 그만하기</button><button id="dlgNext">다음 ▸</button></div>
    </div>
  </div>
</div>

<div id="chapterIntro">
  <div class="ci-ornament">✦ ✧ ✦</div>
  <div class="ci-num" id="ciNum"></div>
  <div class="ci-title" id="ciTitle"></div>
  <div class="ci-myth" id="ciMyth"></div>
  <div class="ci-skip">화면을 누르면 넘어가요</div>
</div>

<div id="birthFlash"></div>
<div id="birthText">
  <h1 id="birthTitle"></h1>
  <p id="birthBody"></p>
  <button id="birthBtn"></button>
</div>

<div id="cardScreen">
  <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <div class="memory-card">
    <div class="icon" id="cardIcon"></div>
    <div class="name" id="cardName"></div>
    <div class="epithet" id="cardEpithet"></div>
  </div>
  <p class="desc">챕터 클리어! "메모리 카드"를 획득했습니다.</p>
  <button id="cardCloseBtn">지도로 돌아가기</button>
</div>

<div id="win" role="dialog"><div class="win-panel"><div class="win-head"><b id="winTitle"></b><button id="winClose" aria-label="닫기">✕</button></div><div id="winBody"></div></div></div>

<div class="toast" id="toast"></div>

<script src="js/story.js"></script>
<script src="js/avatar.js"></script>
<script src="js/game.js"></script>
</body>
</html>
