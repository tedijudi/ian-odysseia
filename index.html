<style>
:root{
  --gold:#f2c66d; --gold2:#d9a441; --ink:#120d26; --lav:#cbb8e8; --cream:#fff8e8;
  --serif:'Gowun Batang', 'Noto Serif KR', 'Nanum Myeongjo', serif;
  --sans:'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; background:var(--ink);}
body{ font-family:var(--sans); color:#fff; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; overscroll-behavior:none; }
button{ font-family:inherit; cursor:pointer; touch-action:manipulation; }
.hidden{display:none !important;}

.screen{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; overflow:hidden; }
.screen.active{ display:flex; }
.pill{ background:rgba(0,0,0,.45); color:#fff; border:1px solid rgba(255,255,255,.18); padding:7px 13px; border-radius:999px; font-size:12px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.btn{ background:linear-gradient(120deg,var(--gold),var(--gold2)); color:#3a2a10; border:none; padding:14px 34px; border-radius:999px; font-size:15px; font-weight:700; box-shadow:0 8px 24px rgba(217,164,65,.4); transition:transform .15s, opacity .3s; }
.btn:active{ transform:scale(.95); }
.btn:disabled{ opacity:.55; box-shadow:none; }

/* ===== 타이틀 ===== */
#screen-title{ justify-content:center; background:radial-gradient(circle at 50% 38%, #3a2a66 0%, #1a1236 55%, #0a0818 100%); }
.star{position:absolute; background:#fff; border-radius:50%; opacity:.6; animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }
.title-inner{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; text-align:center; padding:20px; }
.logo{ font-size:11px; letter-spacing:5px; color:var(--gold2); font-weight:700; }
.hero-orb{ width:clamp(96px, 26vh, 180px); aspect-ratio:1; border-radius:50%; overflow:hidden; margin:clamp(10px,3vh,22px) 0; border:2px solid rgba(242,198,109,.8);
  box-shadow:0 0 0 6px rgba(242,198,109,.12), 0 0 50px rgba(242,198,109,.45); animation:orbFloat 5s ease-in-out infinite; }
.hero-orb img{ width:100%; height:100%; object-fit:cover; display:block; }
@keyframes orbFloat{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
.title-main{ font-family:var(--serif); font-size:clamp(24px, 6.5vw, 38px); color:var(--gold); font-weight:700; letter-spacing:2px; text-shadow:0 0 24px rgba(242,198,109,.5); }
.title-sub2{ font-family:var(--serif); font-size:15px; color:var(--lav); margin-top:6px; letter-spacing:3px; }
.sub{ font-family:var(--serif); color:#b8a8d0; margin-top:clamp(8px,2.4vh,18px); font-size:14px; }
.dday{ margin:6px 0 clamp(12px,3vh,24px); font-size:13px; color:var(--gold); letter-spacing:2px; font-weight:700; }
.loadbar{ width:160px; height:3px; background:rgba(255,255,255,.12); border-radius:3px; margin-top:14px; overflow:hidden; transition:opacity .4s; }
.loadbar i{ display:block; height:100%; width:0; background:var(--gold); transition:width .2s; }

/* ===== 월드맵 ===== */
#screen-map{ background:radial-gradient(ellipse at 50% 0%, #6a5a9a 0%, #3a2a5a 45%, #1c1433 100%); padding:calc(10px + var(--sat)) calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal)); }
.map-header{ width:100%; max-width:820px; display:flex; align-items:center; justify-content:space-between; gap:10px; z-index:5; }
.map-header .center{ text-align:center; }
.map-title{ font-family:var(--serif); font-size:22px; color:var(--cream); font-weight:700; margin-top:2px; }
.map-progress{ font-size:12px; color:var(--gold); min-width:64px; text-align:right; }
#worldMapArea{ position:relative; width:100%; max-width:820px; flex:1; margin-top:8px; }
.cloud{position:absolute; font-size:24px; opacity:.35; animation:drift 34s linear infinite; pointer-events:none;}
@keyframes drift{ from{transform:translateX(-60px);} to{transform:translateX(110vw);} }
.mapSvg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
.mapSvg path{stroke:var(--gold); stroke-width:2.5; fill:none; stroke-dasharray:7 7; opacity:.6; animation:dash 2s linear infinite; vector-effect:non-scaling-stroke;}
@keyframes dash{ to{ stroke-dashoffset:-28; } }
.node{ position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; z-index:6; background:none; border:none; color:inherit; }
.node-circle{ position:relative; width:clamp(52px,9vh,68px); aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:clamp(22px,4vh,30px);
  background:radial-gradient(circle,#fff9e8,var(--gold)); border:3px solid #fff8e0; box-shadow:0 0 22px rgba(242,198,109,.6); animation:nodePulse 2.4s ease-in-out infinite; }
@keyframes nodePulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.07);} }
.node.soon .node-circle{ background:#5a5468; filter:grayscale(.6); opacity:.55; animation:none; box-shadow:none; }
.node.cleared .node-circle{ animation:none; box-shadow:0 0 14px rgba(127,209,185,.6); border-color:#bff0e0; }
.node .badge{ position:absolute; right:-4px; top:-4px; width:22px; height:22px; border-radius:50%; background:#7fd1b9; color:#12302a; font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }
.node-label{ margin-top:6px; font-size:11px; font-weight:700; background:rgba(20,10,35,.75); padding:4px 9px; border-radius:999px; color:var(--gold); white-space:nowrap; }
.node-sub{ font-size:10px; color:#d8cdef; margin-top:3px; white-space:nowrap; text-shadow:0 1px 3px #000; }

/* ===== 게임 화면 ===== */
#screen-game{ background:#07060f; }
#topBar{ flex-shrink:0; width:100%; display:flex; align-items:center; gap:10px; padding:calc(6px + var(--sat)) calc(10px + var(--sar)) 6px calc(10px + var(--sal)); background:linear-gradient(180deg,rgba(18,13,38,.95),rgba(18,13,38,.75)); z-index:30; }
#hud{ flex:1; min-width:0; text-align:center; }
#hudTitle{ font-size:12.5px; font-weight:700; color:#ffe9c0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#hudBar{ height:4px; max-width:220px; margin:4px auto 0; border-radius:4px; background:rgba(255,255,255,.14); overflow:hidden; }
#hudBar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#ffb3d0,var(--gold)); transition:width .4s; }

#gameWrap{ flex:1 1 auto; min-height:0; width:100%; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:none; }
#ambient{ position:absolute; inset:-40px; background-size:cover; background-position:center; filter:blur(26px) brightness(.4) saturate(1.2); transition:background-image .4s; }
#stage{ position:relative; overflow:hidden; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.6); }
#parallaxBg{ position:absolute; inset:0; overflow:hidden; background:#bcdcf5; }
#parallaxImg{ position:absolute; bottom:0; left:0; max-width:none; transition:opacity .35s; will-change:transform; }
canvas#game{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#screenFlash{ position:absolute; inset:0; background:#fff8e0; opacity:0; pointer-events:none; z-index:8; }
#screenFlash.flashPulse{ animation:flashPulseAnim .45s ease; }
@keyframes flashPulseAnim{ 0%{opacity:.5;} 100%{opacity:0;} }
.shakeFx{ animation:shakeAnim .3s ease; }
@keyframes shakeAnim{ 10%{transform:translate(-5px,3px);} 30%{transform:translate(5px,-3px);} 50%{transform:translate(-4px,2px);} 70%{transform:translate(4px,-2px);} 100%{transform:translate(0,0);} }
#missionList{ position:absolute; top:6px; left:6px; right:6px; display:flex; gap:5px; flex-wrap:wrap; z-index:6; pointer-events:none; }
.m-tag{ padding:3px 8px; border-radius:999px; background:rgba(10,8,24,.55); font-size:10.5px; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
.m-tag.done{ background:rgba(127,209,185,.92); color:#12302a; font-weight:700; }
#floatMsg{ position:absolute; left:50%; top:16%; transform:translateX(-50%); max-width:88%; width:max-content; background:rgba(255,255,255,.95); color:#6a4f96; padding:9px 16px; border-radius:14px; font-family:var(--serif); font-size:13.5px; line-height:1.5; text-align:center; z-index:9; box-shadow:0 6px 16px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; }
#floatMsg.show{ opacity:1; transform:translateX(-50%) translateY(4px); }

/* 조작 버튼 */
#controls{ flex-shrink:0; width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px calc(16px + var(--sar)) calc(12px + var(--sab)) calc(16px + var(--sal)); background:linear-gradient(0deg,rgba(18,13,38,.98),rgba(18,13,38,.8)); z-index:30; }
.dpad{ display:flex; gap:10px; }
.ctl{ width:66px; height:66px; border-radius:50%; border:2px solid rgba(255,255,255,.55); background:rgba(255,255,255,.12); color:#fff; font-size:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); touch-action:none; transition:transform .08s, background .15s; }
.ctl.pressed{ transform:scale(.9); background:rgba(255,255,255,.3); }
.ctl.main{ width:78px; height:78px; background:radial-gradient(circle,#ffe27a,#e0a93a); color:#3a2a10; border-color:#fff; font-weight:900; box-shadow:0 6px 18px rgba(0,0,0,.4); }
.ctl.main small{ font-size:11px; margin-top:1px; }
.ctl.main.idle{ background:rgba(255,255,255,.12); color:rgba(255,255,255,.55); border-color:rgba(255,255,255,.3); box-shadow:none; }
.ctl.main.ready{ animation:actionPulse 1.1s ease-in-out infinite; }
@keyframes actionPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
#hint{ flex:1; text-align:center; font-size:11.5px; color:#cfc4ea; line-height:1.45; }

/* 가로 모드(휴대폰) — 버튼을 화면 위에 띄움 */
@media (orientation:landscape) and (max-height:560px){
  #topBar{ padding-top:calc(4px + var(--sat)); padding-bottom:4px; }
  #controls{ position:absolute; left:0; right:0; bottom:0; background:none; pointer-events:none; padding:0 calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal)); }
  #controls > *{ pointer-events:auto; }
  #hint{ visibility:hidden; }
  .ctl{ width:58px; height:58px; background:rgba(10,8,24,.35); }
  .ctl.main{ width:68px; height:68px; }
  .ctl.main.idle{ background:rgba(10,8,24,.35); }
}

/* ===== 대화창 ===== */
#dialogueOverlay{ position:fixed; inset:0; background:linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 60%); display:none; align-items:flex-end; justify-content:center; z-index:100; }
#dialogueStage{ width:100%; max-width:880px; display:flex; flex-direction:column; align-items:flex-start; padding:0 calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal)); }
#portraitCard{ position:relative; width:min(34vw,150px); aspect-ratio:1; margin:0 0 -26px 12px; z-index:2; border-radius:16px; overflow:hidden; border:2px solid #e8c77a;
  box-shadow:0 0 0 4px rgba(18,13,38,.85), 0 0 26px rgba(242,198,109,.35), 0 12px 24px rgba(0,0,0,.5); background:radial-gradient(circle,#fff8e8,#c9b8e8); animation:portraitIn .45s cubic-bezier(.34,1.56,.64,1); }
#portraitCard.breathe img{ animation:breatheAnim 3s ease-in-out infinite; }
#portraitCard img{ width:100%; height:100%; object-fit:cover; object-position:50% 20%; display:block; }
#portraitCard::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 62%,rgba(12,10,30,.75)); pointer-events:none; }
#portraitFallback{ display:none; width:100%; height:100%; align-items:center; justify-content:center; font-size:min(16vw,68px); }
#portraitCard.glow{ box-shadow:0 0 0 4px rgba(18,13,38,.85), 0 0 40px rgba(255,240,200,.8); }
@keyframes breatheAnim{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.03) translateY(-2px);} }
@keyframes portraitIn{ from{transform:translateY(30px) scale(.85); opacity:0;} to{transform:none; opacity:1;} }
#dialogueBox{ position:relative; width:100%; background:linear-gradient(160deg,rgba(24,28,58,.96),rgba(12,14,34,.97)); border:2px solid #b8c8e0; border-radius:14px;
  padding:34px 18px 18px; box-shadow:0 0 0 1px rgba(255,255,255,.08) inset, 0 12px 30px rgba(0,0,0,.5); max-height:min(56vh,360px); overflow-y:auto; animation:boxIn .3s ease; }
@keyframes boxIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
#speakerName{ display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid rgba(255,233,176,.25); }
#speakerName b{ color:#ffe9b0; font-size:14px; }
#speakerName b::before{ content:'「 '; } #speakerName b::after{ content:' 」'; }
#speakerName small{ color:#b9aee0; font-size:11.5px; }
#dialogueText{ font-family:var(--serif); color:#f3f0fb; font-size:15.5px; line-height:1.85; min-height:3.6em; white-space:pre-line; text-shadow:0 1px 3px rgba(0,0,0,.6); }
#dialogueText .em{ color:#ffd98a; font-weight:700; }
#nextIndicator{ position:absolute; right:14px; bottom:8px; color:#ffe9b0; font-size:12px; animation:bounceArrow 1s ease-in-out infinite; }
#dialogueCount{ position:absolute; right:14px; top:10px; font-size:10.5px; color:#8e86b4; }
@keyframes bounceArrow{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(4px);} }
@media (orientation:landscape) and (max-height:560px){
  #dialogueStage{ flex-direction:row; align-items:flex-end; gap:12px; }
  #portraitCard{ width:min(36vh,170px); margin:0; flex-shrink:0; }
  #dialogueBox{ padding:14px 18px 16px; max-height:calc(100vh - 24px); }
  #dialogueText{ font-size:14.5px; line-height:1.75; }
}

/* ===== 챕터 인트로 / 탄생 / 클리어 ===== */
#chapterIntro{ position:fixed; inset:0; background:#08061a; display:none; align-items:center; justify-content:center; flex-direction:column; z-index:500; padding:30px; text-align:center; }
#chapterIntro .ci-ornament{font-size:20px; color:var(--gold); opacity:0; animation:ciFade 3.4s ease forwards; margin-bottom:14px;}
#chapterIntro .ci-num{font-size:12px; letter-spacing:6px; color:var(--lav); margin-bottom:10px; opacity:0; animation:ciFade 3.4s ease forwards;}
#chapterIntro .ci-title{font-family:var(--serif); font-size:26px; color:var(--cream); font-weight:700; opacity:0; animation:ciFade 3.4s ease .15s forwards;}
#chapterIntro .ci-myth{font-family:var(--serif); font-size:14.5px; color:#d8c8f0; margin-top:16px; line-height:1.9; opacity:0; animation:ciFade 3.4s ease .3s forwards; max-width:480px; white-space:pre-line;}
#chapterIntro .ci-skip{ position:absolute; bottom:calc(18px + var(--sab)); font-size:11px; color:#6d6390; }
@keyframes ciFade{ 0%{opacity:0; transform:translateY(10px);} 12%{opacity:1; transform:none;} 85%{opacity:1;} 100%{opacity:0;} }

#birthFlash{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:300; transition:opacity 1s ease; }
#birthText{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; background:radial-gradient(circle,#fff6e0,#f2c66d); z-index:250; text-align:center; padding:24px; }
#birthText h1{ font-family:var(--serif); font-size:22px; color:#7a5fa0; margin-bottom:14px; }
#birthText p{ font-family:var(--serif); color:#6a4f7a; margin-bottom:22px; font-size:15px; line-height:1.9; max-width:480px; white-space:pre-line; }
#birthText button{ padding:13px 28px; border-radius:999px; border:none; background:#8a6fb0; color:#fff; font-weight:700; font-size:14px; }

#cardScreen{ position:fixed; inset:0; background:rgba(10,6,26,.96); display:none; align-items:center; justify-content:center; flex-direction:column; z-index:200; text-align:center; padding:20px; }
.stars{display:flex; gap:10px; margin-bottom:10px;}
.stars span{font-size:28px; opacity:0; transform:scale(0); animation:starPop .5s ease forwards;}
.stars span:nth-child(1){animation-delay:.2s;} .stars span:nth-child(2){animation-delay:.5s;} .stars span:nth-child(3){animation-delay:.8s;}
@keyframes starPop{ to{opacity:1; transform:scale(1);} }
.memory-card{ width:clamp(150px,34vh,200px); aspect-ratio:200/270; border-radius:18px; background:linear-gradient(160deg,var(--gold),#8a6fb0); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; box-shadow:0 20px 40px rgba(0,0,0,.5), 0 0 0 3px rgba(255,255,255,.25) inset; margin-bottom:14px; animation:pop .6s ease 1.1s both; }
@keyframes pop{from{transform:scale(.3) rotate(-6deg); opacity:0;} to{transform:scale(1); opacity:1;}}
.memory-card .icon{font-size:44px; margin-bottom:10px;}
.memory-card .name{font-family:var(--serif); font-weight:700; font-size:16px;}
.memory-card .epithet{font-size:11px; opacity:.9; margin-top:6px; padding:0 14px;}
#cardScreen p.desc{opacity:0; animation:ciFadeIn .5s ease 1.3s forwards; margin-bottom:14px; color:var(--gold); font-size:13px;}
#cardScreen button{padding:11px 28px; border-radius:999px; border:none; background:#fff; color:#2b2a4a; font-weight:700; opacity:0; animation:ciFadeIn .5s ease 1.4s forwards;}
@keyframes ciFadeIn{to{opacity:1;}}

.toast{position:fixed; top:calc(56px + var(--sat)); left:50%; transform:translateX(-50%); background:#2a1f4a; color:var(--gold); padding:10px 18px; border-radius:999px; font-size:13px; z-index:600; opacity:0; transition:opacity .3s; border:1px solid var(--gold); pointer-events:none; max-width:90vw; text-align:center;}
</style>
</head>
<body>

<!-- ================= 타이틀 ================= -->
<section class="screen active" id="screen-title">
  <div class="title-inner">
    <div class="logo">✦ AN EPIC OF A SMALL HERO ✦</div>
    <div class="hero-orb"><img src="images/ian.webp" alt="이안"></div>
    <h1 class="title-main">ΟΔΥΣΣΕΙΑ ΤΟΥ ΙΑΝ</h1>
    <div class="title-sub2">오디세이아 · 이안의 서사시</div>
    <p class="sub">뮤즈여, 노래하소서 — 작은 영웅의 여정을</p>
    <div class="dday">D+<span id="dday"></span></div>
    <button class="btn" id="startBtn" disabled>불러오는 중…</button>
    <div class="loadbar" id="loadbar"><i id="loadFill"></i></div>
  </div>
</section>

<!-- ================= 월드맵 ================= -->
<section class="screen" id="screen-map">
  <div class="map-header">
    <button class="pill" id="mapBackBtn">← 처음</button>
    <div class="center"><div class="logo">THE JOURNEY MAP</div><div class="map-title">여정의 지도</div></div>
    <div class="map-progress" id="mapProgress"></div>
  </div>
  <div id="worldMapArea"></div>
</section>

<!-- ================= 게임 화면 ================= -->
<section class="screen" id="screen-game">
  <div id="topBar">
    <button class="pill" id="backToMap">← 지도</button>
    <div id="hud"><div id="hudTitle"></div><div id="hudBar"><i id="hudFill"></i></div></div>
    <button class="pill" id="muteBtn">🔊</button>
  </div>
  <div id="gameWrap">
    <div id="ambient"></div>
    <div id="stage">
      <div id="parallaxBg"><img id="parallaxImg" alt=""></div>
      <canvas id="game"></canvas>
      <div id="screenFlash"></div>
      <div id="missionList"></div>
      <div id="floatMsg"></div>
    </div>
  </div>
  <div id="controls">
    <div class="dpad">
      <button class="ctl" id="btnLeft" aria-label="왼쪽">◀</button>
      <button class="ctl" id="btnRight" aria-label="오른쪽">▶</button>
    </div>
    <div id="hint"></div>
    <button class="ctl main idle" id="mainBtn"><span id="mainIcon">❗</span><small id="mainLabel">대화</small></button>
  </div>
</section>

<!-- ================= 대화창 ================= -->
<div id="dialogueOverlay">
  <div id="dialogueStage">
    <div id="portraitCard"><img id="portraitImg" alt=""><div id="portraitFallback"></div></div>
    <div id="dialogueBox">
      <div id="speakerName"></div>
      <div id="dialogueText"></div>
      <div id="dialogueCount"></div>
      <div id="nextIndicator">▼</div>
    </div>
  </div>
</div>

<div id="chapterIntro">
  <div class="ci-ornament">✦ ✧ ✦</div>
  <div class="ci-num" id="ciNum"></div>
  <div class="ci-title" id="ciTitle"></div>
  <div class="ci-myth" id="ciMyth"></div>
  <div class="ci-skip">화면을 누르면 넘어가요</div>
</div>

<div id="birthFlash"></div>
<div id="birthText">
  <h1 id="birthTitle"></h1>
  <p id="birthBody"></p>
  <button id="birthBtn"></button>
</div>

<div id="cardScreen">
  <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <div class="memory-card">
    <div class="icon" id="cardIcon"></div>
    <div class="name" id="cardName"></div>
    <div class="epithet" id="cardEpithet"></div>
  </div>
  <p class="desc">챕터 클리어! "메모리 카드"를 획득했습니다.</p>
  <button id="cardCloseBtn">지도로 돌아가기</button>
</div>

<div class="toast" id="toast"></div>

<script src="js/story.js"></script>
<script src="js/game.js"></script>
</body>
</html>
